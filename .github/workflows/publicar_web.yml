name: publicar-web

# Espejo de la rama `paginas` hacia un repositorio PÚBLICO, para que GitHub
# Pages lo sirva gratis. Solo hace falta si este repositorio sigue siendo
# privado y no hay plan Pro: en el plan gratuito, Pages no sirve repositorios
# privados. Si algún día Pages sirve directo desde la rama `paginas` de acá,
# este workflow no hace nada y no molesta.
#
# Para activarlo hacen falta dos cosas, las dos se cargan en Settings del repo:
#   - una variable  WEB_REPO  = "usuario/repositorio-publico"
#   - un secreto    WEB_TOKEN = token de acceso fino con permiso de escritura
#                               en "Contents" SOLO sobre ese repositorio público
# Mientras falten, el workflow termina en verde diciendo que no hay espejo.

on:
  push:
    branches:
      - paginas
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  espejo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paginas
          fetch-depth: 1
          # Sin esto, el checkout deja la credencial del robot de Actions
          # configurada para todo github.com y pisa al token que va en la URL
          # del push: el push sale firmado por github-actions[bot], que no tiene
          # permiso sobre el repositorio público, y da 403.
          persist-credentials: false

      - name: Copiar la edición al repositorio público
        env:
          WEB_REPO: ${{ vars.WEB_REPO }}
          WEB_TOKEN: ${{ secrets.WEB_TOKEN }}
        run: |
          if [ -z "${WEB_REPO}" ] || [ -z "${WEB_TOKEN}" ]; then
            echo "Sin WEB_REPO o sin WEB_TOKEN: no hay espejo público configurado."
            echo "Si GitHub Pages sirve directo desde la rama paginas de este repositorio, esto no hace falta."
            exit 0
          fi
          # Por si quedó alguna credencial del checkout de todos modos.
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          # Al repositorio público va solo el sitio: sin el workflow que viaja en
          # esta rama para poder dispararse.
          git rm -rq .github
          git -c user.name="rutina" -c user.email="rutina@users.noreply.github.com" \
            commit -qm "edición $(date -u +%Y-%m-%d)"
          git -c user.name="rutina" -c user.email="rutina@users.noreply.github.com" \
            push --force "https://x-access-token:${WEB_TOKEN}@github.com/${WEB_REPO}.git" HEAD:refs/heads/main
          echo "edición copiada a ${WEB_REPO}"
